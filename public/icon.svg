<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Badge with sleek rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="12"/>

  <!-- Iconic Monogram S with sharp cyber angles for SHIV -->
  <path d="M 345 155 L 210 155 C 165 155 140 180 140 220 C 140 260 170 275 220 290 L 292 312 C 342 327 372 345 372 385 C 372 425 345 450 300 450 L 165 450" 
        fill="none" 
        stroke="url(#brandGrad)" 
        stroke-width="52" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Glowing Accent Indicator Dot (Cyan) -->
  <circle cx="375" cy="155" r="22" fill="#00f2fe" filter="url(#neonGlow)"/>
  
  <!-- Subtle Amber Terminal Dot -->
  <circle cx="135" cy="450" r="16" fill="#f97316"/>
</svg>
