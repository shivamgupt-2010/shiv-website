<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="musicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b26"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#musicBg)"/>
  
  <rect x="30" y="30" width="740" height="540" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Waveform lines in background -->
  <g opacity="0.15" stroke="url(#pinkGrad)" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="280" x2="120" y2="320"/>
    <line x1="150" y1="250" x2="150" y2="350"/>
    <line x1="180" y1="230" x2="180" y2="370"/>
    <line x1="210" y1="260" x2="210" y2="340"/>
    <line x1="240" y1="210" x2="240" y2="390"/>
    <line x1="560" y1="210" x2="560" y2="390"/>
    <line x1="590" y1="260" x2="590" y2="340"/>
    <line x1="620" y1="230" x2="620" y2="370"/>
    <line x1="650" y1="250" x2="650" y2="350"/>
    <line x1="680" y1="280" x2="680" y2="320"/>
  </g>

  <!-- Musicshiv Emblem -->
  <g transform="translate(400, 220)">
    <circle cx="0" cy="0" r="70" fill="rgba(244, 114, 182, 0.08)" stroke="url(#pinkGrad)" stroke-width="2"/>
    <!-- Stylized musical note and acoustic wave -->
    <path d="M -15 25 A 15 15 0 1 1 0 12 L 0 -35 L 30 -25 L 30 15 A 15 15 0 1 1 15 2 Z" fill="url(#pinkGrad)"/>
  </g>

  <g transform="translate(400, 325)">
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="rgba(244, 114, 182, 0.12)" stroke="rgba(244, 114, 182, 0.3)" stroke-width="1.5"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f472b6" text-anchor="middle" letter-spacing="1.5">ARTIST &amp; CREATOR</text>
  </g>

  <text x="400" y="390" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">Musicshiv</text>
  <text x="400" y="425" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#cbd5e1" text-anchor="middle">Hindi Indie-Pop • Songwriting &amp; Acoustic Storytelling</text>

  <g transform="translate(220, 460)">
    <text x="180" y="20" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
      Featured Releases: "Adhoora Safar" • "The Raah Trilogy" (Aahat, Darmiyan, Ghar)
    </text>
  </g>

  <text x="400" y="545" font-family="system-ui, sans-serif" font-size="12" fill="#475569" text-anchor="middle">
    Drop shivam-gupta-music.jpg in public/images/ceo/ to replace
  </text>
</svg>
