<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  <rect width="800" height="1000" fill="url(#grid)"/>
  <circle cx="400" cy="380" r="320" fill="url(#glow)"/>

  <!-- Outer Border -->
  <rect x="24" y="24" width="752" height="952" rx="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Subtle Corner Accents -->
  <path d="M 44 80 L 44 44 L 80 44" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 756 80 L 756 44 L 720 44" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 44 920 L 44 956 L 80 956" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 756 920 L 756 956 L 720 956" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>

  <!-- Card Container for Avatar -->
  <g transform="translate(400, 370)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#neonGrad)" stroke-width="3" stroke-dasharray="12 8" opacity="0.8"/>
    <circle cx="0" cy="0" r="148" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

    <!-- Stylized Executive Monogram Silhouette -->
    <path d="M -50 70 C -45 10 -30 -40 0 -50 C 30 -40 45 10 50 70 Z" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="-60" r="38" fill="rgba(129, 140, 248, 0.2)" stroke="#818cf8" stroke-width="2"/>

    <!-- SHIV Emblem Center -->
    <path d="M -22 -15 L 0 -38 L 22 -15 L 12 -15 L 12 18 L -12 18 L -12 -15 Z" fill="url(#neonGrad)"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#090d16" text-anchor="middle" letter-spacing="1">SHIV</text>
  </g>

  <!-- Tag / Status Badge -->
  <g transform="translate(400, 580)">
    <rect x="-130" y="-18" width="260" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <circle cx="-105" cy="0" r="4" fill="#34d399"/>
    <text x="8" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">FOUNDER &amp; CEO</text>
  </g>

  <!-- Title & Typography -->
  <text x="400" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">SHIVAM GUPTA</text>
  <text x="400" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Chief Executive Officer • SHIV Technologies</text>

  <!-- Divider Line -->
  <line x1="280" y1="740" x2="520" y2="740" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Info Pills -->
  <g transform="translate(400, 790)">
    <rect x="-240" y="-18" width="480" height="36" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      SHIV Identity: <tspan fill="#38bdf8" font-weight="800">@shivam</tspan> • Burhar, Madhya Pradesh, India
    </text>
  </g>

  <!-- Mission Tagline -->
  <text x="400" y="870" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="2">IDEAS INTO IMPACT • EST. 2026</text>

  <!-- Replacement Notice for Shivam -->
  <text x="400" y="930" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">
    Drop shivam-gupta-ceo.jpg in public/images/ceo/ to replace with real photo
  </text>
</svg>
